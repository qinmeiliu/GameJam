<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUACKDUNNIT – Vegas Infinite Game Jam</title>
  <!-- Oswald (Capitana stand-in) from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0010;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      display: block;
      /* Let the browser use smooth filtering when upscaling our 1280×720
         canvas to the user's window — important for text legibility.
         (Was `pixelated` from the initial pixel-art scaffold; that made
         text crunchy on any HiDPI / scaled display.) */
      image-rendering: auto;
    }
    #game-container {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser 3 from CDN — no build step needed -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Cache-bust: bump ?v=… across all script tags below to force fresh fetches after a deploy -->
  <!-- Game data & systems (must load before scenes) -->
  <script src="src/utils/constants.js?v=20260513-11"></script>
  <script src="src/data/murders.js?v=20260513-11"></script>
  <script src="src/systems/RoundController.js?v=20260513-11"></script>

  <!-- Scenes (load order matters) -->
  <script src="src/scenes/BootScene.js?v=20260513-11"></script>
  <script src="src/scenes/PreloadScene.js?v=20260513-11"></script>
  <script src="src/scenes/MenuScene.js?v=20260513-11"></script>
  <script src="src/scenes/LobbyScene.js?v=20260513-11"></script>
  <script src="src/scenes/GameScene.js?v=20260513-11"></script>
  <script src="src/scenes/UIScene.js?v=20260513-11"></script>
  <script src="src/main.js?v=20260513-11"></script>
</body>
</html>

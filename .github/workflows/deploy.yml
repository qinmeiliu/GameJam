# ============================================================
# GitHub Actions – Auto-deploy to GitHub Pages
# Triggers on every push to the `main` branch.
# No build step needed — it just serves the repo as static files.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # also allow manual trigger from the Actions tab

permissions:
  contents: read
  pages:    write
  id-token: write

# Only allow one deploy at a time; cancel any in-flight run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # serve the entire repo root as the site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
